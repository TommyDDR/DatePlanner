# Complément de l'unité du service : le proxy est sur une AUTRE machine.
#
# Traefik tourne sur la VM proxy (192.168.1.51, deploy/traefik/) : Next doit
# donc écouter sur le réseau et non sur la seule boucle locale. C'est le
# pare-feu de la VM de DatePlanner qui ferme le port 3000 à tout le reste :
#
#   sudo ufw allow from 192.168.1.51 to any port 3000 proto tcp
#
# Sans cette règle, Next serait joignable en clair depuis le réseau local ;
# il renverrait bien la requête vers https (src/lib/https-redirect.ts), mais
# la seule porte d'entrée doit rester le proxy.
#
# Installation :
#   sudo mkdir -p /etc/systemd/system/dateplanner.service.d
#   sudo cp deploy/dateplanner-proxy-distant.conf /etc/systemd/system/dateplanner.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart dateplanner

[Service]
ExecStart=
# Tas borné à 1 Go sur une VM de 2 Go : une fuite ou une charge anormale fait
# tomber Node, qui redémarre, plutôt que PostgreSQL, voisin sur la machine.
ExecStart=/usr/bin/node --max-old-space-size=1024 node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3000
