# Journal systemd borné - DatePlanner écrit ses erreurs dans journald.
#
# Installation :
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-dateplanner.conf /etc/systemd/journald.conf.d/dateplanner.conf
#   sudo systemctl restart systemd-journald
#
# Sans borne, journald garde jusqu'à 10 % du disque, et un disque plein arrête
# PostgreSQL avant d'arrêter le journal. La durée est bornée aussi : une pile
# d'erreur peut porter une adresse ou un fragment de requête, et trente jours
# suffisent à comprendre une panne signalée par la supervision
# (deploy/supervision/). C'est la durée que la politique de confidentialité
# annonce (`SUPERVISION_RETENTION.logsDays`, src/config/retention.ts), la même
# que la copie du journal sur le conteneur de supervision :
# `tests/unit/supervision.test.ts` confronte les deux.
#
# Lire les erreurs :
#   journalctl -u dateplanner --since "1 hour ago"
#   journalctl -u dateplanner -p err --since today

[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=30d
