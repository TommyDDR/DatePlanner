# Journal systemd borné - DatePlanner écrit ses erreurs dans journald.
#
# Installation :
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-dateplanner.conf /etc/systemd/journald.conf.d/dateplanner.conf
#   sudo systemctl restart systemd-journald
#
# Sans borne, journald garde jusqu'à 10 % du disque, et un disque plein arrête
# PostgreSQL avant d'arrêter le journal. La durée est bornée aussi : une pile
# d'erreur peut porter une adresse ou un fragment de requête, et un mois
# suffit à comprendre une panne.
#
# Lire les erreurs :
#   journalctl -u dateplanner --since "1 hour ago"
#   journalctl -u dateplanner -p err --since today

[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=1month
