# Traefik - DatePlanner (configuration dynamique, conteneur proxy
# 192.168.1.51).
#
# Installation : sudo cp deploy/traefik/dateplanner.yml /etc/traefik/dynamic/
# Traefik relit le répertoire de lui-même (`watch`), sans redémarrage. Le
# point d'entrée `websecure` et le résolveur `letsencrypt` sont ceux de
# laserit.fr, déjà déclarés dans la configuration statique du conteneur
# proxy.
#
# DNS : `dateplanner.fr` et `www.dateplanner.fr` pointent sur l'adresse
# publique ; l'ancien `dateplanner.laserit.fr` reste un CNAME de `laserit.fr.`
# chez OVH. Les certificats sont obtenus pour ces noms au premier accès.

http:
  routers:
    dateplanner:
      rule: "Host(`dateplanner.fr`)"
      entryPoints: [websecure]
      service: dateplanner
      tls:
        certResolver: letsencrypt

    # `www` et l'ancienne adresse renvoient, en permanence, sur la seule
    # adresse publique : les liens déjà partagés ou envoyés par email restent
    # valides, et le site n'existe que sous un nom (cookies, métadonnées).
    dateplanner-ancien-nom:
      rule: "Host(`www.dateplanner.fr`) || Host(`dateplanner.laserit.fr`)"
      entryPoints: [websecure]
      middlewares: [dateplanner-vers-domaine]
      # Jamais atteint : la redirection répond avant lui.
      service: dateplanner
      tls:
        certResolver: letsencrypt

  middlewares:
    dateplanner-vers-domaine:
      redirectRegex:
        regex: "^https?://[^/]+(.*)"
        replacement: "https://dateplanner.fr${1}"
        permanent: true

  services:
    dateplanner:
      loadBalancer:
        servers:
          # Le conteneur 202 (adresse fixe). Next y écoute sur le réseau, et
          # le pare-feu de Proxmox n'ouvre son port 3000 qu'au proxy :
          # voir deploy/dateplanner-proxy-distant.conf.
          - url: "http://192.168.1.53:3000"
